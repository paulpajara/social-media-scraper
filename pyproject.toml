[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ph-government-sentiment"
version = "0.1.0"
description = "Reproducible CSV-first social-media research for Philippine government sentiment"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "requests>=2.32.4,<3",
  "python-dotenv>=1.0.1,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8"]
notebook = ["jupyterlab>=4.3,<5"]

[project.scripts]
ph-sentiment = "ph_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

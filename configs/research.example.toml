# Secrets belong in the environment or an ignored .env file.
# Dates describe Asia/Manila calendar days; end_date is exclusive.
[research]
start_date = "2026-01-01"
end_date = "2027-01-01"
max_records = 1000
max_pages = 20
include_comments = false
queries = ['Philippine government', 'Philippine administration', 'gobyerno', 'pamahalaan']

[analysis]
minimum_records = 200
n_topics = 3
seed = 42
max_features = 5000
top_terms = 10
max_pairs = 5000

[x]
# Recent search covers only seven days. Archive needs the appropriate API entitlement.
search_mode = "archive"

[threads]
search_type = "RECENT"
search_mode = "KEYWORD"

[bluesky]
# Verified public first pages; this deployment denied cursor pagination.
max_pages = 1
queries = ["Philippines Marcos", "Philippine government", "gobyerno", "pamahalaan"]

[mastodon]
max_pages = 4
hashtags = ["Philippines", "Marcos", "PhilippinePolitics", "BBM", "PHPolitics", "Gobyerno"]
government_terms = ["gobyerno", "pamahalaan", "government", "administration", "president", "marcos", "bbm", "duterte"]
country_terms = ["philippines", "philippine", "pilipinas", "filipino", "pinoy", "gobyerno", "pamahalaan", "bbm"]
